<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#primaryGrad)" />
  
  <rect x="32" y="32" width="448" height="448" rx="120" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.2" />

  <path 
    d="M110 256h60l45-120 70 240 55-120h62" 
    fill="none" 
    stroke="url(#accentGrad)" 
    stroke-width="40" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <circle cx="340" cy="136" r="24" fill="#ffffff" filter="url(#glow)" />
</svg>
